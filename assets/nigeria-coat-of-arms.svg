<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Coat of Arms of Nigeria">
  <!-- Simplified, respectful representation of the Coat of Arms of Nigeria for web use -->
  <!-- Horses -->
  <g fill="#111827">
    <!-- Left horse -->
    <path d="M42 118c-8-18-6-38 8-50 6-5 14-7 20-4 3 2 4 5 3 8-2 4-6 6-10 7-3 1-5 3-5 6 0 3 2 5 5 6l8 3c6 2 10 7 11 13l2 12c1 6-2 12-7 15l-12 8c-4 2-9 2-12-1-5-4-8-10-9-17-1-2-1-4-2-6z"/>
    <ellipse cx="48" cy="72" rx="10" ry="12"/>
    <path d="M40 64c-4-6-2-12 3-15 2-1 5 0 6 2"/>
    <!-- Right horse (mirrored) -->
    <path d="M158 118c8-18 6-38-8-50-6-5-14-7-20-4-3 2-4 5-3 8 2 4 6 6 10 7 3 1 5 3 5 6 0 3-2 5-5 6l-8 3c-6 2-10 7-11 13l-2 12c-1 6 2 12 7 15l12 8c4 2 9 2 12-1 5-4 8-10 9-17 1-2 1-4 2-6z"/>
    <ellipse cx="152" cy="72" rx="10" ry="12"/>
    <path d="M160 64c4-6 2-12-3-15-2-1-5 0-6 2"/>
  </g>

  <!-- Shield -->
  <path d="M70 70c0 0 10-8 30-8s30 8 30 8v52c0 28-18 42-30 48-12-6-30-20-30-48V70z" fill="#166534" stroke="#0f3d22" stroke-width="2"/>
  <!-- Y-shaped rivers -->
  <path d="M100 72v40M100 112l-18 28M100 112l18 28" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 72v40M100 112l-18 28M100 112l18 28" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>

  <!-- Eagle crest -->
  <g transform="translate(100,48)">
    <ellipse cx="0" cy="-2" rx="10" ry="7" fill="#111827"/>
    <path d="M-18 2c8-10 28-10 36 0-10-2-26-2-36 0z" fill="#111827"/>
    <circle cx="-3" cy="-3" r="1.2" fill="#fbbf24"/>
    <path d="M6 -1l8 2-8 1z" fill="#f59e0b"/>
  </g>

  <!-- Ground / grassy base -->
  <ellipse cx="100" cy="178" rx="58" ry="12" fill="#166534" opacity="0.25"/>
  <path d="M55 170c8 10 22 16 45 16s37-6 45-16c-10 4-26 7-45 7s-35-3-45-7z" fill="#166534"/>
  <!-- Flowers suggestion -->
  <circle cx="72" cy="168" r="3" fill="#f59e0b"/>
  <circle cx="128" cy="168" r="3" fill="#f59e0b"/>
  <circle cx="100" cy="172" r="2.5" fill="#fbbf24"/>

  <!-- Motto ribbon -->
  <path d="M48 188h104c4 0 6 3 6 6s-2 6-6 6H48c-4 0-6-3-6-6s2-6 6-6z" fill="#14532D"/>
  <text x="100" y="197.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8" font-weight="700" fill="#fff" letter-spacing="1.5">UNITY AND FAITH</text>
</svg>
